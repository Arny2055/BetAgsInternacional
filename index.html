<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Live & Standings Tool</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Encabezado -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-emerald-400 mb-2">⚽ Panel de Fútbol API-Football</h1>
            <p class="text-slate-400 text-sm">Consulta partidos en vivo y tablas de posiciones en tiempo real.</p>
        </header>

        <!-- Barra de Control -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mb-8 flex flex-wrap gap-4 items-end justify-between">
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Seleccionar Acción</label>
                <div class="flex gap-2">
                    <button onclick="switchTab('live')" id="btn-live" class="px-5 py-2.5 rounded-lg font-semibold transition bg-emerald-600 text-white shadow">Partidos en Vivo</button>
                    <button onclick="switchTab('standings')" id="btn-standings" class="px-5 py-2.5 rounded-lg font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600">Tabla de Posiciones</button>
                </div>
            </div>

            <!-- Filtros para Standings (Ocultos por defecto) -->
            <div id="standings-filters" class="hidden flex gap-3 items-end">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Liga</label>
                    <select id="league-select" class="bg-slate-900 border border-slate-700 text-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="39">Premier League (Inglaterra)</option>
                        <option value="140">La Liga (España)</option>
                        <option value="135">Serie A (Italia)</option>
                        <option value="78">Bundesliga (Alemania)</option>
                        <option value="61">Ligue 1 (Francia)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Temporada</label>
                    <select id="season-select" class="bg-slate-900 border border-slate-700 text-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="2025" selected>2025/2026</option>
                        <option value="2024">2024/2025</option>
                        <option value="2023">2023/2024</option>
                    </select>
                </div>
                <button onclick="fetchStandings()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition">Cargar</button>
            </div>

            <button onclick="loadData()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
                🔄 Actualizar
            </button>
        </div>

        <!-- Contenedor de Resultados -->
        <div id="loading" class="text-center py-12 text-slate-400 hidden">Cargando datos desde la API...</div>
        <div id="error-box" class="bg-red-900/50 border border-red-700 text-red-200 p-4 rounded-xl mb-6 hidden"></div>
        
        <div id="content-container">
            <!-- Los resultados se inyectan aquí dinámicamente -->
        </div>
    </div>

    <!-- Script de lógica -->
    <script>
        const API_KEY = "b87bae2028d2da2ee28c5d36a60f3ab8";
        const BASE_URL = "https://v3.football.api-sports.io";
        let currentView = 'live';

        const headers = {
            'x-apisports-key': API_KEY
        };

        function switchTab(view) {
            currentView = view;
            const btnLive = document.getElementById('btn-live');
            const btnStandings = document.getElementById('btn-standings');
            const filters = document.getElementById('standings-filters');

            if (view === 'live') {
                btnLive.className = "px-5 py-2.5 rounded-lg font-semibold transition bg-emerald-600 text-white shadow";
                btnStandings.className = "px-5 py-2.5 rounded-lg font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600";
                filters.classList.add('hidden');
                fetchLiveMatches();
            } else {
                btnStandings.className = "px-5 py-2.5 rounded-lg font-semibold transition bg-emerald-600 text-white shadow";
                btnLive.className = "px-5 py-2.5 rounded-lg font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600";
                filters.classList.remove('hidden');
                fetchStandings();
            }
        }

        function loadData() {
            if (currentView === 'live') {
                fetchLiveMatches();
            } else {
                fetchStandings();
            }
        }

        async function fetchLiveMatches() {
            showLoading(true);
            hideError();
            try {
                const response = await fetch(`${BASE_URL}/fixtures?live=all`, { headers });
                const data = await response.json();
                
                if (response.status !== 200) throw new Error(data.message || "Error al conectar con la API");

                renderLiveMatches(data.response);
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        async function fetchStandings() {
            showLoading(true);
            hideError();
            const league = document.getElementById('league-select').value;
            const season = document.getElementById('season-select').value;

            try {
                const response = await fetch(`${BASE_URL}/standings?league=${league}&season=${season}`, { headers });
                const data = await response.json();

                if (response.status !== 200) throw new Error(data.message || "Error al conectar con la API");

                renderStandings(data.response);
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        function renderLiveMatches(matches) {
            const container = document.getElementById('content-container');
            if (!matches || matches.length === 0) {
                container.innerHTML = `<div class="bg-slate-800 p-8 rounded-xl text-center text-slate-400 border border-slate-700">📭 No hay partidos en vivo en este momento.</div>`;
                return;
            }

            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            matches.forEach(match => {
                html += `
                    <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl shadow-md flex flex-col justify-between">
                        <div class="text-xs text-emerald-400 font-semibold mb-3 flex justify-between items-center">
                            <span>${match.league.name}</span>
                            <span class="bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full animate-pulse">${match.fixture.status.elapsed}' EN VIVO</span>
                        </div>
                        <div class="flex items-center justify-between my-2">
                            <div class="flex items-center gap-3 w-5/12">
                                <img src="${match.teams.home.logo}" class="w-8 h-8 object-contain">
                                <span class="font-medium text-sm truncate">${match.teams.home.name}</span>
                            </div>
                            <div class="text-xl font-bold tracking-widest bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700">
                                ${match.goals.home} - ${match.goals.away}
                            </div>
                            <div class="flex items-center gap-3 w-5/12 justify-end text-right">
                                <span class="font-medium text-sm truncate">${match.teams.away.name}</span>
                                <img src="${match.teams.away.logo}" class="w-8 h-8 object-contain">
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderStandings(response) {
            const container = document.getElementById('content-container');
            if (!response || response.length === 0) {
                container.innerHTML = `<div class="bg-slate-800 p-8 rounded-xl text-center text-slate-400 border border-slate-700">📭 No hay datos de tabla para esta liga y temporada.</div>`;
                return;
            }

            const leagueData = response[0].league;
            const standings = leagueData.standings[0];

            let html = `
                <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-lg overflow-hidden">
                    <div class="p-5 border-b border-slate-700 bg-slate-800/50">
                        <h2 class="text-lg font-bold text-slate-200">🏆 ${leagueData.name} (${leagueData.season})</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-900/60 text-slate-400 uppercase text-xs tracking-wider border-b border-slate-700">
                                    <th class="p-3 text-center">Pos</th>
                                    <th class="p-3">Equipo</th>
                                    <th class="p-3 text-center">PJ</th>
                                    <th class="p-3 text-center">G</th>
                                    <th class="p-3 text-center">E</th>
                                    <th class="p-3 text-center">P</th>
                                    <th class="p-3 text-center">DG</th>
                                    <th class="p-3 text-center font-bold text-emerald-400">Pts</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700/50">
            `;

            standings.forEach(team => {
                html += `
                    <tr class="hover:bg-slate-700/30 transition">
                        <td class="p-3 text-center font-semibold text-slate-400">${team.rank}</td>
                        <td class="p-3 flex items-center gap-3">
                            <img src="${team.team.logo}" class="w-6 h-6 object-contain">
                            <span class="font-medium text-slate-200">${team.team.name}</span>
                        </td>
                        <td class="p-3 text-center text-slate-300">${team.all.played}</td>
                        <td class="p-3 text-center text-slate-300">${team.all.win}</td>
                        <td class="p-3 text-center text-slate-300">${team.all.draw}</td>
                        <td class="p-3 text-center text-slate-300">${team.all.lose}</td>
                        <td class="p-3 text-center text-slate-300">${team.goalsDiff > 0 ? '+' + team.goalsDiff : team.goalsDiff}</td>
                        <td class="p-3 text-center font-bold text-emerald-400">${team.points}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            container.innerHTML = html;
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
            if (show) document.getElementById('content-container').innerHTML = '';
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.textContent = `❌ Error: ${msg}`;
            box.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error-box').classList.add('hidden');
        }

        // Cargar partidos en vivo por defecto al iniciar
        fetchLiveMatches();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Dashboard Pro - API-SPORTS Widgets</title>
    <!-- Tailwind CSS para el diseño general de la interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Configuración Global requerida por API-SPORTS Widgets -->
    <api-sports-widget
        data-type="config"
        data-key="b87bae2028d2da2ee28c5d36a60f3ab8"
        data-sport="football"
        data-lang="es"
        data-timezone="Europe/Madrid"
        data-show-logos="true"
        data-show-errors="true"
        data-theme="dark"
        data-target-game="#details-container"
        data-target-standings="#details-container"
        data-target-team="#details-container"
    ></api-sports-widget>

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- Encabezado del Dashboard -->
        <header class="text-center mb-10 border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-extrabold text-emerald-400 mb-2">⚽ Centro de Control de Fútbol</h1>
            <p class="text-slate-400 text-sm">Panel en tiempo real impulsado por API-SPORTS Widgets v3.1</p>
        </header>

        <!-- Layout Principal en Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Columna Izquierda: Partidos en Vivo y Próximos (2 Columnas de ancho en LG) -->
            <div class="lg:col-span-2 space-y-8">
                
                <!-- Sección 1: Partidos en Vivo (Actualización cada 15s) -->
                <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                    <h2 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">
                        <span class="inline-block w-3 h-3 bg-red-500 rounded-full animate-ping"></span> 
                        Partidos en Vivo
                    </h2>
                    <api-sports-widget 
                        data-type="games" 
                        data-tab="live" 
                        data-refresh="15"
                        data-show-toolbar="true"
                    ></api-sports-widget>
                </section>

                <!-- Sección 2: Partidos del Día (General) -->
                <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                    <h2 class="text-lg font-bold text-indigo-400 mb-4">📅 Partidos de la Jornada</h2>
                    <api-sports-widget 
                        data-type="games" 
                        data-show-toolbar="true"
                    ></api-sports-widget>
                </section>

                <!-- Sección 3: Contenedor Dinámico para Detalles (Partidos, Tablas, Equipos) -->
                <section id="details-section" class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                    <h2 class="text-lg font-bold text-sky-400 mb-4">🔍 Vista de Detalles / Análisis</h2>
                    <div id="details-container" class="min-h-[250px] text-slate-400 text-sm flex items-center justify-center border border-dashed border-slate-800 rounded-xl p-4">
                        Selecciona un partido, equipo o liga superior para ver los detalles aquí.
                    </div>
                </section>

            </div>

            <!-- Columna Derecha: Ligas y Clasificaciones -->
            <div class="space-y-8">
                
                <!-- Sección 4: Tabla de Clasificación de la Premier League (Ejemplo ID: 39, Temporada: 2024/2025) -->
                <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                    <h2 class="text-lg font-bold text-amber-400 mb-4">🏆 Premier League - Standings</h2>
                    <api-sports-widget 
                        data-type="standings" 
                        data-league="39" 
                        data-season="2024"
                    ></api-sports-widget>
                </section>

                <!-- Sección 5: Navegador de Ligas Globales -->
                <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                    <h2 class="text-lg font-bold text-purple-400 mb-4">🌍 Explorador de Ligas</h2>
                    <api-sports-widget 
                        data-type="leagues"
                    ></api-sports-widget>
                </section>

            </div>

        </div>
    </div>

    <!-- Script Oficial de Carga de Web Components de API-SPORTS -->
    <script type="module" src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>
</body>
</html>
